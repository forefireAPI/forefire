name: 📦 Build & Test Docker Image

on:
  push:
    paths-ignore: [ "docs/**", "**/*.md" ]
    branches: [ "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    paths-ignore: [ "docs/**", "**/*.md" ]
    branches: [ "master" ]
  workflow_dispatch:

# A new push to a PR cancels its older run. Pushes to branches, tags and
# releases each get their own group, so none is ever queued or dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: false # only tests/runff is needed, fetched below

      - uses: ./.github/actions/lfs-runff

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For git tags like v1.2.3, create a Docker tag 1.2.3
            type=semver,pattern={{version}}
            # For all other events (pushes to master, PRs)
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Only push if the ref starts with 'refs/tags/'
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true

      - name: Run 'runff' Test Script on the built image
        run: |
          TEST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "Testing image with tag: $TEST_TAG"
          docker run --rm $TEST_TAG bash -c "cd tests/runff && bash ff-run.bash"