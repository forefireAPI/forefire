name: 🌐 Build WASM

# Builds the WebAssembly module (issue #171) and runs the Node smoke test. On
# dev it also publishes the browser demo to GitHub Pages, from the same build.
# The .wasm is built here rather than committed: it is a megabyte of generated
# output, and a stale binary next to live sources is worse than a two minute
# build.
#
# The github-pages environment has to allow dev as a deployment branch
# (Settings → Environments → github-pages). Forks publish only when their own
# Pages is set to deploy from GitHub Actions; most forks have no Pages at all.
#
# A published release gets the module attached (forefire.wasm, forefire.mjs,
# worker.mjs and their SHA256SUMS), so users can pin a version instead of the
# Pages copy, which changes on every push to dev. It runs on release rather
# than on the tag because the release is created by hand after the tag.

on:
  push:
    paths-ignore: [ "docs/**", "**/*.md" ]
    branches:
      - "master"
      - "dev"
  pull_request:
    paths-ignore: [ "docs/**", "**/*.md" ]
    branches: [ "master", "dev" ]
  release:
    types: [ published ]
  workflow_dispatch:

# A new push to a PR cancels its older run. Pushes to branches, tags and
# releases each get their own group, so none is ever queued or dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.pages.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        # No LFS: the WASM build reads no test data, and emcmake turns the
        # integrity check off by default.

      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-6.0.6

      - name: Install Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          # Pinned to the version the module was developed and tested against.
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 6.0.6
          ~/emsdk/emsdk activate 6.0.6

      - name: Build the WebAssembly module
        run: |
          source ~/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j"$(nproc)"

      - name: Report size
        run: |
          {
            echo "### WebAssembly build"
            echo "| file | raw | gzip | brotli |"
            echo "| --- | --- | --- | --- |"
            for f in bin/forefire.wasm bin/forefire.mjs; do
              printf '| `%s` | %s | %s | %s |\n' "$(basename "$f")" \
                "$(stat -c%s "$f" | numfmt --to=iec)" \
                "$(gzip -c "$f" | wc -c | numfmt --to=iec)" \
                "$(brotli -c "$f" | wc -c | numfmt --to=iec)"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test under Node
        run: node bindings/wasm/smoke.mjs bin/forefire.mjs

      - name: Upload the module for the release
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: wasm-release
          path: |
            bin/forefire.wasm
            bin/forefire.mjs
            bindings/wasm/worker.mjs

      # The demo is published from dev only. The official repo always
      # publishes, so a Pages misconfiguration there fails loudly.
      - name: Decide whether to publish
        id: pages
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REPOSITORY" = forefireAPI/forefire ] ||
             [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" -q .build_type 2>/dev/null)" = workflow ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble the site
        if: steps.pages.outputs.publish == 'true'
        run: |
          mkdir -p _site
          cp bin/forefire.mjs bin/forefire.wasm _site/
          cp bindings/wasm/index.html bindings/wasm/worker.mjs \
             bindings/wasm/landscape.mjs bindings/wasm/terrain3d.mjs _site/

      - name: Upload artifact
        if: steps.pages.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build-wasm
    if: needs.build-wasm.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; queued runs supersede rather than race.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release-assets:
    needs: build-wasm
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the module
        uses: actions/download-artifact@v8
        with:
          name: wasm-release
          path: wasm

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        working-directory: wasm
        run: |
          # The artifact keeps bin/ and bindings/wasm/; the release wants them flat.
          find . -mindepth 2 -type f -exec mv {} . \;
          sha256sum forefire.wasm forefire.mjs worker.mjs > SHA256SUMS
          gh release upload "$TAG" forefire.wasm forefire.mjs worker.mjs SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
