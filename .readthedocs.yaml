# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.10"
  apt_packages:
    - doxygen 

  jobs:
    pre_build: # Run doxygen first, assuming Doxyfile is in docs/readthedocs/doxygen
      - "doxygen docs/readthedocs/doxygen/Doxyfile"

sphinx:
   configuration: docs/readthedocs/source/conf.py


python:
   install:
   - requirements: docs/readthedocs/source/requirements.txt